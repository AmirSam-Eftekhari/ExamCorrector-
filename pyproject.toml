[project]
name = "examcorrector"
version = "0.1.0"
description = "Offline, template-based OMR & exam assessment platform"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
